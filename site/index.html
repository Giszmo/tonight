<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tonight — what's on near you</title>
<meta name="description" content="Open local event listings on nostr. Read for free, scout on demand, pay only for what you ask for.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>/* Listings should read like a printed city magazine: a time column you can scan,
   a title that carries the line, everything else quieter. */
:root {
  --bg: #12100e;
  --panel: #1b1815;
  --line: #2e2823;
  --ink: #f4efe8;
  --dim: #a2988c;
  --accent: #ffb545;
  --accent-ink: #2a1c05;
  --warn: #ff8d6b;
  --radius: 10px;
  --max: 46rem;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #fbf8f4; --panel: #fff; --line: #e6ded3; --ink: #1b1815; --dim: #6c6156;
    --accent: #b3600a; --accent-ink: #fff;
  }
}
* { box-sizing: border-box }
html, body { margin: 0; padding: 0 }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: 7rem;
}
a { color: inherit }
h1, h2, h3 { font-weight: 640; letter-spacing: -0.02em; margin: 0 }

.top {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  max-width: var(--max); margin: 0 auto; padding: 1.25rem 1rem 0.5rem;
}
.brand { display: flex; align-items: center; gap: .6rem }
.brand h1 { font-size: 1.45rem }
.logo {
  width: .85rem; height: .85rem; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 .3rem color-mix(in srgb, var(--accent) 22%, transparent);
}

.picker { max-width: var(--max); margin: 0 auto; padding: .25rem 1rem 0 }
.cities, .when { display: flex; flex-wrap: wrap; gap: .4rem; margin: .5rem 0 }
.when { margin-top: .75rem }
.chip {
  font: inherit; font-size: .92rem; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: .32rem .8rem; cursor: pointer; display: inline-flex; align-items: center; gap: .35rem;
}
.chip:hover { border-color: var(--accent) }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600 }
.chip .x { opacity: .45; font-size: 1rem; line-height: 1 }
.chip .x:hover { opacity: 1 }

.addcity { position: relative }
.addcity input {
  font: inherit; width: 100%; background: transparent; color: var(--ink);
  border: 0; border-bottom: 1px solid var(--line); padding: .35rem .1rem; outline: none;
}
.addcity input:focus { border-color: var(--accent) }
.suggest {
  position: absolute; z-index: 5; left: 0; right: 0; background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-top: .25rem;
}
.sugg { display: block; width: 100%; text-align: left; font: inherit; color: var(--ink);
  background: none; border: 0; padding: .5rem .7rem; cursor: pointer }
.sugg:hover { background: var(--line) }

main { max-width: var(--max); margin: 0 auto; padding: 0 1rem }
.status { color: var(--dim); font-size: .9rem; padding: .75rem 0 }
.list { list-style: none; margin: .5rem 0 0; padding: 0 }
.daysep {
  font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--dim);
  margin: 1.4rem 0 .5rem; border-bottom: 1px solid var(--line); padding-bottom: .3rem;
}
.card { display: flex; gap: .9rem; padding: .85rem 0; border-bottom: 1px solid var(--line) }
.card .time { flex: 0 0 3.6rem; font-variant-numeric: tabular-nums; color: var(--accent); padding-top: .1rem }
.card h3 { font-size: 1.06rem; line-height: 1.3 }
.card .summary { margin: .3rem 0 0; color: var(--dim); font-size: .93rem }
.card .meta { margin: .35rem 0 0; color: var(--dim); font-size: .86rem }
.card .tags { margin: .3rem 0 0; display: flex; gap: .35rem; flex-wrap: wrap }
.tag { font-size: .75rem; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: .05rem .45rem }
.card .actions { margin: .5rem 0 0; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap }
.going {
  font: inherit; font-size: .85rem; cursor: pointer; padding: .2rem .7rem; border-radius: 999px;
  background: transparent; color: var(--ink); border: 1px solid var(--line);
}
.going:hover { border-color: var(--accent) }
.going.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.counts, .src { font-size: .82rem; color: var(--dim) }
.src { text-decoration: underline; text-underline-offset: 2px }
.empty { padding: 2rem 0; color: var(--ink) }
.empty .dim, .dim { color: var(--dim) }

.scoutbar {
  position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--panel) 94%, transparent);
  backdrop-filter: blur(8px); border-top: 1px solid var(--line);
}
.scoutbar > * { max-width: var(--max) }
.scoutbar {
  display: flex; gap: 1rem; align-items: center; justify-content: space-between;
  padding: .7rem 1rem calc(.7rem + env(safe-area-inset-bottom));
}
.runinfo { font-size: .84rem; color: var(--dim); max-width: 28rem }
.primary {
  font: inherit; font-weight: 620; cursor: pointer; white-space: nowrap;
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: var(--radius);
  padding: .55rem 1rem;
}
.primary:disabled { opacity: .55; cursor: progress }
.ghost {
  font: inherit; font-size: .9rem; cursor: pointer; background: transparent; color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--radius); padding: .35rem .75rem;
  margin-right: .4rem; text-decoration: none; display: inline-block;
}
.ghost:hover { border-color: var(--accent) }
.linkish { font: inherit; font-size: .85rem; background: none; border: 0; color: var(--dim);
  cursor: pointer; text-decoration: underline; text-underline-offset: 3px }

.foot {
  max-width: var(--max); margin: 2rem auto 0; padding: 1rem; color: var(--dim); font-size: .8rem;
  display: flex; gap: 1rem; justify-content: space-between; align-items: baseline;
}

dialog {
  width: min(34rem, 92vw); background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 1.25rem;
}
dialog::backdrop { background: rgba(0,0,0,.55) }
dialog h2 { font-size: 1rem; margin: 1rem 0 .4rem }
dialog h2:first-child { margin-top: 0 }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem; word-break: break-all }
.bolt { display: block; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: .5rem; max-height: 6rem; overflow: auto }
.wide { width: 100%; font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); padding: .5rem }
.candidates { max-height: 50vh; overflow: auto; margin: .5rem 0; display: grid; gap: .5rem }
.cand { display: flex; gap: .6rem; align-items: start; padding: .45rem; border: 1px solid var(--line); border-radius: var(--radius) }
.cand.dup { opacity: .55 }
.cand .meta { display: block; color: var(--dim); font-size: .83rem }
.warn { color: var(--warn); font-size: .83rem }
.qr { background: #fff; padding: .5rem; border-radius: var(--radius); width: min(14rem, 60%); margin: .5rem 0 }
.qr svg { display: block; width: 100%; height: auto }

/* --- scouting: budget, live run, candidate review --- */
.budgets { display: flex; gap: .4rem; flex-wrap: wrap; margin: .5rem 0 }
.bar { height: .35rem; background: var(--line); border-radius: 999px; overflow: hidden; margin: .5rem 0 }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s ease }
.runlog {
  list-style: none; margin: .5rem 0; padding: 0; max-height: 40vh; overflow: auto;
  font-size: .88rem; color: var(--dim);
}
.runlog li { padding: .2rem 0 .2rem .9rem; position: relative }
.runlog li::before { content: '·'; position: absolute; left: .1rem; color: var(--accent) }
.runlog li[data-pending="1"] { color: var(--ink) }
.runsrc { font-size: .78rem; word-break: break-word }
.candidates .daysep { margin: .8rem 0 .3rem }
.candidates .daysep:first-child { margin-top: 0 }

/* --- paid --- */
.center { text-align: center }
.big { font-size: 1.3rem; font-weight: 640; margin: .2rem 0 }
.paid { display: flex; justify-content: center; margin: .5rem 0 0 }
.paid .tick {
  display: grid; place-items: center; width: 3rem; height: 3rem; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink); font-size: 1.5rem; font-weight: 700;
  animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) both;
}
@keyframes pop { from { transform: scale(.2); opacity: 0 } to { transform: scale(1); opacity: 1 } }
.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: var(--radius) }
.confetti i {
  position: absolute; top: -1rem; border-radius: 1px; opacity: 0;
  animation: fall var(--d) var(--delay) cubic-bezier(.25, .6, .4, 1) forwards;
}
@keyframes fall {
  0% { opacity: 1; transform: translate3d(0, -1rem, 0) rotate(0) }
  100% { opacity: 0; transform: translate3d(var(--x), 40rem, 0) rotate(var(--r)) }
}
@media (prefers-reduced-motion: reduce) {
  .paid .tick { animation: none }
}
.check { display: flex; gap: .5rem; align-items: start; font-size: .9rem; color: var(--dim); cursor: pointer }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <h1>Tonight</h1>
  </div>
  <div class="ident" id="ident" title="your nostr identity on this device"></div>
</header>

<nav class="picker" aria-label="place and time">
  <div class="cities" id="cities"></div>
  <form class="addcity" id="addcity" autocomplete="off">
    <input id="cityq" type="search" placeholder="add a city…" aria-label="add a city">
    <div class="suggest" id="suggest" hidden></div>
  </form>
  <div class="when" id="when" role="tablist"></div>
</nav>

<main>
  <div id="status" class="status"></div>
  <ul id="list" class="list"></ul>
  <div id="empty" class="empty" hidden></div>
</main>

<section class="scoutbar" id="scoutbar">
  <div class="runinfo" id="runinfo"></div>
  <button id="scout" class="primary">Scout this city now</button>
</section>

<footer class="foot">
  <span>Events, endorsements and scouting records are <a href="https://github.com/nostr-protocol/nips/blob/master/52.md" target="_blank" rel="noopener">NIP-52</a> events on public relays. Anything you publish here is public.</span>
  <button id="settings-open" class="linkish">settings</button>
</footer>

<dialog id="sheet">
  <div class="sheet-body" id="sheet-body"></div>
  <form method="dialog"><button class="ghost">close</button></form>
</dialog>
